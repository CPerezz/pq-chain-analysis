# Claude reviews every card a pull request adds or changes against the archive node; the pull request is merged when
# every card holds, otherwise a maintainer decides (tools/verify_pr.py). Comments `/verify`, `/verify all` and
# `/accept CARD REASON` start a review again; every hour a review paused by Claude's usage limit is resumed.
# pull_request_target and issue_comment run this file from main, with the secrets: the pull request's files are read
# as data, and nothing from them runs.
name: verify

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["findings/**", "triage/**", "review/queue.tsv", "review/ledger.tsv"]
  issue_comment:
    types: [created]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: write

concurrency:
  group: verify-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || 'resume' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

env:
  GH_TOKEN: ${{ github.token }}
  MAINTAINERS: CPerezz,kevaundray

jobs:
  verify:
    if: >-
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, '/verify') || startsWith(github.event.comment.body, '/accept')))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Claude Code, and viem for the node tool
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.323
          echo 'import "npm:viem@2.21.0";' > "$RUNNER_TEMP/viem.ts"
          deno cache "$RUNNER_TEMP/viem.ts"
      - name: The SSH key of the archive node's account, which can only forward to the node's RPC port
        env:
          NODE_SSH_KEY: ${{ secrets.NODE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "157.180.2.180 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA67uLCwQjK5aOpYzUEMuN0J/nwhrtVW26k+DEqzUILB" > ~/.ssh/known_hosts
          printf '%s\n' "$NODE_SSH_KEY" > "$RUNNER_TEMP/node_key"
          chmod 600 "$RUNNER_TEMP/node_key"
      - run: uv run tools/verify_pr.py "$PR"
        env:
          ETH_RPC_URL: http://127.0.0.1:8545
          NODE_SSH: rpc-ci@157.180.2.180
          NODE_SSH_KEY_FILE: ${{ runner.temp }}/node_key
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          COMMENT: ${{ github.event.comment.body }}
          COMMENT_BY: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-${{ env.PR }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pq-verify/cards
          if-no-files-found: ignore
          retention-days: 30

  resume:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv run tools/verify_pr.py --resume
