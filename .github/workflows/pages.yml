# After every merge to main: the site in docs/, with its data built from that commit's cards (board/ingest.py, then
# tools/site_data.py), published on GitHub Pages. The repository's Pages source is "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --with pyyaml python board/ingest.py . "$RUNNER_TEMP/registry.db"
      - run: uv run tools/site_data.py "$RUNNER_TEMP/registry.db" docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
